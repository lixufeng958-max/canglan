<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游戏大厅</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="游戏大厅">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1E24">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 游戏大厅：所有游戏的总入口。加新游戏：把游戏放进一个文件夹，再在下面 <main> 里照着抄一张卡片即可。 */
:root{--bg:#101216;--panel:#1F2228;--panel-2:#2A2E36;--text:#ECE4D2;--muted:#9A917F;--line:#4A4F5A;--brass:#D9A93A;--seal:#B8352A;
  --display:"Noto Serif SC","Songti SC","STSong",serif;--body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .7  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--grain),radial-gradient(130% 70% at 50% 0%,#2E323B 0%,var(--bg) 60%)}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 28px) max(18px,env(safe-area-inset-left,0px)) calc(var(--sb) + 40px) max(18px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
header h1{margin:0;font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.12em;line-height:1.1}
header h1 small{display:block;font-size:12px;letter-spacing:.4em;color:var(--brass);font-weight:600;margin-top:6px}
header .seal{margin-left:auto;background:var(--seal);color:#FFF1E0;font-family:var(--display);font-weight:900;font-size:16px;padding:6px 8px;border-radius:3px;letter-spacing:.2em;box-shadow:inset 0 0 0 2px rgba(255,240,220,.3)}
.games{display:flex;flex-direction:column;gap:16px}
.game{display:block;color:inherit;text-decoration:none;background:var(--grain),linear-gradient(#262A32,#1B1E24);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s,border-color .15s}
.game:active{transform:scale(.985)}
.game:hover{border-color:var(--brass)}
.game .cover{position:relative;aspect-ratio:16/9;background:#13263A center/cover no-repeat;border-bottom:2px solid var(--brass)}
.game .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(16,18,22,.85))}
.game .cover b{position:absolute;left:16px;bottom:12px;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.1em;text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:1}
.game .cover .tag{position:absolute;right:12px;top:12px;background:rgba(16,18,22,.8);border:1px solid var(--brass);color:var(--brass);font-size:12px;padding:2px 8px;border-radius:3px;z-index:1;font-family:var(--display);font-weight:600}
.game .in{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.game p{margin:0;color:var(--muted);font-size:13.5px}
.game .meta{display:flex;flex-wrap:wrap;gap:6px}
.game .meta span{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 8px;color:var(--text);background:var(--panel-2)}
.game .go{align-self:flex-end;background:var(--seal);color:#FFF1E0;font-family:var(--display);font-weight:700;letter-spacing:.1em;padding:9px 22px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,235,210,.22),0 2px 0 #5E1C18;font-size:15px}
.soon{border-style:dashed;opacity:.55}
.soon .cover{aspect-ratio:auto;height:84px;display:grid;place-items:center;border-bottom:0;background:var(--panel)}
.soon .cover::after{display:none}
.soon .cover b{position:static;font-size:20px;color:var(--muted);text-shadow:none}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px;font-family:var(--display)}
footer .u{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>游戏大厅<small>和朋友一起玩</small></h1><span class="seal">合集</span></header>
  <main class="games">
    <a class="game" href="luanzhan/">
      <div class="cover" style="background-image:url(luanzhan/cover.jpg)"><span class="tag">2–6 人联机 · 可单机</span><b>苍澜·乱战</b></div>
      <div class="in">
        <p>实时国战卡牌策略：25 分钟一局，占六成江山称霸。写实地形地图，43 种卡牌，6 种特殊兵种，半路截杀，天时变幻。</p>
        <div class="meta"><span>策略</span><span>实时</span><span>卡牌</span><span>新手教程</span></div>
        <span class="go">进入游戏</span>
      </div>
    </a>
    <a class="game" href="qingshu/">
      <div class="cover" style="background-image:url(qingshu/cover.jpg)"><span class="tag">2–4 人联机 · 可单机</span><b>情书·宫廷传书</b></div>
      <div class="in">
        <p>轻松的猜牌小游戏：16 张牌 8 种角色，每人手里只有 1 张。猜牌淘汰、比牌、偷看、调换，把情书送到公主手里。几分钟一轮，先集满 ❤ 的人赢。</p>
        <div class="meta"><span>卡牌</span><span>回合制</span><span>轻松</span><span>同一个账号</span></div>
        <span class="go">进入游戏</span>
      </div>
    </a>
    <div class="game soon"><div class="cover"><b>更多游戏 · 敬请期待</b></div></div>
  </main>
  <footer><span class="u" id="who"></span><span id="whoTip">添加到主屏幕，下次直接从这里进</span><br><span style="opacity:.5">大厅 v3 · 2 个游戏</span></footer>
</div>
<script>
// 显示已登录的昵称（和游戏共用 Firebase 登录；没网或没登录就不显示）
(async () => {
  try {
    const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
    const cfg = { apiKey: "AIzaSyA27zpELbBDvsExehldumfZ3WGwEEbiexY", authDomain: "tianxia-a53f0.firebaseapp.com", projectId: "tianxia-a53f0", storageBucket: "tianxia-a53f0.firebasestorage.app", messagingSenderId: "266462227755", appId: "1:266462227755:web:4f68a074385457b23d696e" };
    const [app, auth] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js")]);
    auth.onAuthStateChanged(auth.getAuth(app.initializeApp(cfg)), u => { if (u) { document.getElementById("who").textContent = "主公 " + (u.displayName || u.email) + " · "; } });
  } catch {}
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    // 有新版本时：不在对局里就立刻刷新；在对局里就等回到首页再刷新。回到前台时也去检查一下有没有新版
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("./sw.js").then(reg => { document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); }); }).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!had) return; location.reload(); });
  }
})();
</script>
</body>
</html>
