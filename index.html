<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>苍澜·乱战</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="苍澜乱战">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1E24">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: full-bleed ancient map (rice paper, brush ink, vermilion seals) with a floating HUD on top, a hand of cards along the bottom, and paper sheets for decisions. One light paper look by design. */
:root{
  --paper:#1F2228; --paper-2:#2A2E36; --paper-3:#343944; --card:#2B2F37;
  --text:#ECE4D2; --ink-soft:#C9BFA8; --muted:#9A917F; --line:#4A4F5A; --line-2:#6A6150;
  --seal:#B8352A; --seal-fg:#FFF1E0; --brass:#D9A93A; --good:#6BBF6E; --bad:#FF6A55; --warn:#E6A33C;
  --c-econ:#E0B13F; --c-support:#6BBF6E; --c-scout:#5FB8E8; --c-defense:#9FB3C8; --c-attack:#FF6A55; --c-disaster:#B48CFF;
  --t1:#9A917F; --t2:#6BBF6E; --t3:#B48CFF; --t4:#E0B13F;
  --brush:"Noto Serif SC","Songti SC","STSong",serif;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"Noto Serif SC",ui-rounded,-apple-system,system-ui,serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --gl:max(14px, env(safe-area-inset-left,0px)); --gr:max(14px, env(safe-area-inset-right,0px));
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .7  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#101216}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;width:100%;-webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 2px rgba(80,60,30,.08)}
input::placeholder{color:var(--muted)}
[hidden]{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.page{overflow-y:auto;padding-top:calc(var(--st) + 0px);padding-bottom:calc(var(--sb) + 28px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--grain),radial-gradient(130% 80% at 50% 30%,#2E323B 0%,var(--paper) 55%,#111317 100%)}
.wrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hero{position:relative;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px))) -8px;height:calc(210px + var(--st));overflow:hidden;flex:none}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .logo{position:absolute;right:max(26px,env(safe-area-inset-right,0px));top:calc(var(--st) + 24px);margin:0;writing-mode:vertical-rl;white-space:nowrap;font-family:var(--brush);font-weight:900;font-size:60px;letter-spacing:.06em;line-height:1;color:var(--text)}
.hero .seal-mark{position:absolute;right:max(100px,calc(env(safe-area-inset-right,0px) + 100px));top:calc(var(--st) + 30px);writing-mode:vertical-rl;white-space:nowrap;background:var(--seal);color:var(--seal-fg);font-family:var(--brush);font-weight:900;font-size:20px;padding:6px 4px;border-radius:3px;letter-spacing:.15em;box-shadow:inset 0 0 0 2px rgba(255,240,220,.35)}
.hero.small{height:calc(150px + var(--st))}
.hero.small .logo{font-size:46px;top:calc(var(--st) + 18px)}
.hero.small .seal-mark{font-size:16px;top:calc(var(--st) + 22px);right:max(82px,calc(env(safe-area-inset-right,0px) + 82px))}
.logo{font-family:var(--brush);font-size:48px;margin:8px 0 0}
.logo small{display:block;font-size:15px;letter-spacing:.5em;color:var(--seal);margin-top:6px}
.lead{color:var(--ink-soft);font-size:14px;margin:0;font-family:var(--display)}
.h{font-family:var(--brush);font-size:22px;color:var(--text);margin:10px 0 -4px;display:flex;align-items:center;gap:10px}
.h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.btn{border:0;border-radius:4px;padding:12px 16px;font-weight:700;background:var(--seal);color:var(--seal-fg);font-size:15px;font-family:var(--display);letter-spacing:.08em;box-shadow:inset 0 0 0 2px rgba(255,235,210,.22),0 2px 0 #5E1C18}
.btn:active{transform:translateY(1px);box-shadow:inset 0 0 0 2px rgba(255,235,210,.22),0 1px 0 #5E1C18}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line-2);font-weight:600;box-shadow:0 1px 0 var(--line-2)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:14px;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.tip{font-size:13px;color:var(--muted)}
.tip b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center;position:relative}
.stat b{display:block;font-size:26px;font-family:var(--num);color:var(--text)}
.stat small{color:var(--muted);font-size:12px;letter-spacing:.2em}
.seg{display:flex;gap:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:4px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:3px;padding:8px 4px;font-size:14px;font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--paper);font-weight:700}
.code{font-family:var(--brush);font-size:56px;letter-spacing:.25em;text-align:center;color:var(--seal);line-height:1.2}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.pl i{width:14px;height:18px;flex:none;clip-path:polygon(0 0,100% 15%,70% 50%,100% 85%,0 100%)}
.pl span{flex:1;font-family:var(--display);font-weight:600}
.pl small{color:var(--muted)}
.pl button{border:0;background:none;color:var(--muted);font-size:14px}

/* ---------- 游戏 ---------- */
#sGame{background:#13263A}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;top:0;left:0;right:0;padding-top:calc(var(--st) + 6px);padding-left:var(--gl);padding-right:var(--gr);display:flex;gap:8px;align-items:flex-start;pointer-events:none;padding-bottom:10px}
.hud>*{pointer-events:auto}
.res{display:flex;gap:4px;min-width:0;flex:1}
.chip{background:rgba(30,33,40,.94);border:1px solid var(--line-2);border-radius:3px;padding:3px 6px;display:flex;flex-direction:column;line-height:1.15;flex:1 1 0;min-width:0;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chip.phase{flex:1.35 1 0;background:#4A2A26;color:#F2EAD8;border-color:#7A3A32}
.chip small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.phase small{color:#D9C6B0}
.chip b{font-size:14px;white-space:nowrap}
.chip.phase.dev{background:#2F4A36;border-color:#2F4A36}
.chip.phase.war{background:#4A2A26}
.chip.phase.final{background:var(--seal);border-color:var(--seal);animation:pulseb 1.2s ease-in-out infinite}
.chip.phase.final small{color:#FFD9CF}
@keyframes pulseb{50%{box-shadow:0 0 0 4px rgba(178,58,42,.3)}}
.hege{position:absolute;top:calc(var(--st) + 58px);left:var(--gl);right:calc(var(--gr) + 60px);z-index:6;background:var(--seal);border:2px solid #7E2519;color:var(--seal-fg);border-radius:3px;padding:8px 12px;font-size:14px;font-weight:700;text-align:center;font-family:var(--display);box-shadow:0 4px 14px rgba(120,30,20,.35)}
.hege.mine{background:#9A6E12;border-color:#6B4B0A}
.hege:not([hidden])~.toasts{top:calc(var(--st) + 112px)}
.hud .btns{position:absolute;right:var(--gr);top:calc(var(--st) + 56px);display:flex;flex-direction:column;gap:6px}
.ibtn{position:relative;border:1px solid var(--line-2);background:rgba(30,33,40,.94);border-radius:3px;height:42px;min-width:46px;padding:0 8px;font-size:15px;font-weight:700;font-family:var(--brush);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ibtn .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--seal);color:#fff;font-size:11px;line-height:18px;padding:0 4px;font-family:var(--body)}
.toasts{position:absolute;top:calc(var(--st) + 58px);left:var(--gl);right:calc(var(--gr) + 62px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{pointer-events:auto;background:rgba(32,35,42,.96);border:1px solid var(--line-2);border-left:5px solid var(--ink-soft);border-radius:3px;padding:8px 12px;font-size:14px;max-width:520px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .25s ease-out;font-family:var(--display)}
.toast.alert{border-left-color:var(--bad);background:#3A2322}
.toast.watch{border-left-color:var(--warn)}
.toast.ping{border-left-color:#C8962E}
.toast.good{border-left-color:var(--good)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 58px);background:#15171B;color:var(--text);border:1px solid var(--brass);border-radius:3px;padding:8px 8px 8px 16px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;z-index:6;max-width:calc(100% - 24px);font-family:var(--display);box-shadow:0 4px 14px rgba(40,30,20,.35)}
.banner button{border:0;background:var(--seal);border-radius:3px;padding:4px 12px;font-weight:700;color:var(--seal-fg)}
.bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(var(--sb) + 8px);padding-left:var(--gl);padding-right:var(--gr);background:linear-gradient(rgba(16,18,22,0),rgba(16,18,22,.92) 34%);padding-top:24px}
.handbar{display:flex;gap:8px;overflow-x:auto;align-items:flex-end;scrollbar-width:none;max-width:760px;margin:0 auto;padding-top:8px}
.handbar::-webkit-scrollbar{display:none}
.shopbtn{flex:none;width:64px;height:92px;border-radius:5px;border:1.5px dashed var(--seal);background:rgba(30,33,40,.9);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-weight:700}
.shopbtn b{font-size:26px;line-height:1;font-family:var(--brush);font-weight:400}
.shopbtn small{font-size:11px}
.empty-hand{color:var(--ink-soft);font-size:13px;align-self:center;padding:0 6px;font-family:var(--display)}
.countdown{position:absolute;inset:0;display:grid;place-items:center;background:rgba(16,18,22,.75);z-index:20;font-family:var(--brush);font-size:96px;color:var(--seal)}
.countdown small{display:block;font-size:18px;font-family:var(--display);color:var(--ink-soft);text-align:center}

/* ---------- 卡牌 ---------- */
.cardmini,.bigcard .face,.rv-card{--tc:var(--t1);position:relative;overflow:hidden;background:var(--grain),radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--cc) 26%,transparent) 0 30%,transparent 62%),linear-gradient(#33373F,#1E2127);border:1.5px solid var(--tc);box-shadow:inset 0 0 0 3px #2A2E36,inset 0 0 0 4px color-mix(in srgb,var(--tc) 55%,transparent),0 3px 8px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--text)}
.t1{--tc:var(--t1)} .t2{--tc:var(--t2)} .t3{--tc:var(--t3)} .t4{--tc:var(--t4)}
.cardmini{flex:none;width:68px;height:92px;border-radius:5px;padding:4px 4px 5px}
.cardmini .cat,.bigcard .face .cat,.rv-card .cat{font-size:10px;font-weight:700;color:var(--cc);letter-spacing:.12em;font-family:var(--display);line-height:1.2;margin-top:3px}
.cardmini .gl{font-family:var(--brush);font-size:34px;line-height:1;color:var(--cc);margin-top:3px}
.cardmini b{font-family:var(--display);font-size:13px;line-height:1.1;margin-top:2px}
.cardmini small{font-size:9.5px;color:var(--tc);margin-top:auto;font-weight:700;letter-spacing:.1em}
.cardmini.locked{filter:grayscale(.85);opacity:.6}
.cardmini.t3::after,.bigcard .face.t3::after,.rv-card.t3::after,.cardmini.t4::after,.bigcard .face.t4::after,.rv-card.t4::after{content:"";position:absolute;inset:3px;border:1px solid var(--tc);border-radius:3px;pointer-events:none;background:linear-gradient(45deg,var(--tc) 0 5px,transparent 5px) top left/12px 12px no-repeat,linear-gradient(-45deg,var(--tc) 0 5px,transparent 5px) top right/12px 12px no-repeat,linear-gradient(135deg,var(--tc) 0 5px,transparent 5px) bottom left/12px 12px no-repeat,linear-gradient(-135deg,var(--tc) 0 5px,transparent 5px) bottom right/12px 12px no-repeat;opacity:.85}
.cardmini.t4,.bigcard .face.t4,.rv-card.t4{background:var(--grain),radial-gradient(circle at 50% 46%,rgba(232,190,90,.3) 0 30%,transparent 62%),linear-gradient(#3F3522,#241F14);animation:goldglow 2.4s ease-in-out infinite}
@keyframes goldglow{50%{box-shadow:inset 0 0 0 3px #2A2E36,inset 0 0 0 4px var(--t4),0 0 16px rgba(224,177,63,.6)}}
.bigcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.bigcard .face{width:90px;height:124px;border-radius:6px;padding:6px 4px;gap:2px;justify-content:flex-start}
.bigcard .face .gl{font-family:var(--brush);font-size:52px;line-height:1;color:var(--cc);margin-top:4px}
.bigcard .face b{font-family:var(--display);font-size:16px}
.bigcard .face .tier{position:absolute;bottom:6px;font-size:11px;color:var(--tc);font-weight:700;letter-spacing:.2em}

/* ---------- 弹出层 ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.scrim.light{background:transparent;pointer-events:none}
.scrim.light .sheet{pointer-events:auto}
.sheet{background:var(--grain),linear-gradient(#262A32,#1B1E24);border:1px solid var(--line-2);border-bottom:0;width:100%;max-width:640px;max-height:82%;border-radius:6px 6px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.5);position:relative}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#8A6A2E,#D9A93A 20%,#8A6A2E 50%,#D9A93A 80%,#8A6A2E);border-radius:6px 6px 0 0}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-head h3{margin:0;font-family:var(--brush);font-weight:900;font-size:24px;flex:1;min-width:0;line-height:1.2}
.sh-head .x{border:1px solid var(--line-2);background:var(--card);border-radius:3px;padding:4px 12px;font-size:14px;font-family:var(--display)}
.sh-body{overflow-y:auto;padding-block:6px calc(18px + var(--sb));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:5px 8px}
.kv small{display:block;font-size:11px;color:var(--muted)}
.kv b{font-size:16px;font-family:var(--num)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1 1 auto}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.owner i{width:11px;height:14px;display:inline-block;clip-path:polygon(0 0,100% 15%,70% 50%,100% 85%,0 100%)}
.cost{display:inline-flex;gap:8px;font-size:13px}
.cost span{background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:1px 7px;font-family:var(--num)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop .item{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.shop .item .top{border-bottom:1px solid var(--line);color:var(--cc);font-size:11px;font-weight:700;padding:3px 10px;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.shop .item .top .gl{font-family:var(--brush);font-size:26px;line-height:1;margin-left:auto;font-weight:400}
.shop .item .in{padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.shop .item b{font-family:var(--display);font-size:18px}
.shop .item p{margin:0;font-size:12px;color:var(--muted);flex:1}
.dip{display:flex;flex-direction:column;gap:8px}
.dip-top{display:flex;align-items:center;gap:8px}
.dip-top i{width:14px;height:18px;clip-path:polygon(0 0,100% 15%,70% 50%,100% 85%,0 100%)}
.dip-top b{font-family:var(--brush);font-weight:400;font-size:22px}
.pill{margin-left:auto;font-size:13px;padding:1px 10px;border-radius:3px;border:1.5px solid currentColor;font-family:var(--brush)}
.pill.war{color:var(--bad)} .pill.ally{color:var(--good)} .pill.peace{color:var(--muted)} .pill.dead{color:var(--muted);text-decoration:line-through}
.log{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;font-size:14px;padding:7px 4px;border-bottom:1px dashed var(--line);font-family:var(--display)}
.log li time{color:var(--muted);font-size:12px;flex:none;width:38px;padding-top:2px;font-family:var(--num)}
.log li.alert{color:var(--bad)} .log li.ping{color:#8A5A10} .log li.phase{color:var(--seal);font-weight:700}
.range{width:100%;accent-color:var(--seal);height:32px}
.mv-n{font-size:34px;text-align:center;font-family:var(--brush)}
.rank{width:100%;border-collapse:collapse;font-size:15px;font-family:var(--display)}
.rank td{padding:8px 6px;border-top:1px dashed var(--line)}
.rank td:last-child{text-align:right}
.rank i{display:inline-block;width:11px;height:14px;margin-right:6px;clip-path:polygon(0 0,100% 15%,70% 50%,100% 85%,0 100%)}
.end-title{font-family:var(--brush);font-size:52px;text-align:center;margin:4px 0 0;letter-spacing:.1em}
.help h4{margin:12px 0 4px;color:var(--seal);font-family:var(--brush);font-weight:400;font-size:20px}
.help p{margin:0 0 6px;font-size:14px;font-family:var(--display)}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-family:var(--brush);font-size:24px}
.shopbtn{position:relative}
.shopbtn .tk{position:absolute;top:-7px;right:-7px;background:var(--seal);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;line-height:18px;font-family:var(--body)}
.draw-box .odds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.draw-box .odds div{border:1.5px solid var(--tc);border-radius:3px;padding:6px;text-align:center;display:flex;flex-direction:column;background:var(--card)}
.draw-box .odds b{color:var(--tc);font-size:17px;font-family:var(--brush);font-weight:400}
.draw-box .odds span{font-size:13px;color:var(--muted);font-family:var(--num)}
.altar{border-color:var(--tc);border-width:1.5px}
.altar b{font-family:var(--brush);font-weight:400;font-size:22px}
.tierpill{font-size:13px;color:var(--tc);border:1.5px solid var(--tc);border-radius:3px;padding:0 10px;margin-left:auto;font-family:var(--brush)}
.altar .acts{margin-top:8px}
.policies{display:flex;flex-direction:column;gap:8px}
.pol{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.pol b{font-family:var(--brush);font-weight:400;font-size:24px;line-height:1.2}
.pol .gain{font-size:13px;color:var(--brass);align-self:center;font-family:var(--num)}
.pol small{grid-column:1/-1;color:var(--ink-soft);font-size:12.5px;line-height:1.5}
.pol.benevolent{border-color:#7FA285}.pol.benevolent b{color:var(--good)}
.pol.tax{border-color:#C9A869}.pol.tax b{color:var(--warn)}
.pol.massacre{border-color:#C95A50;background:#3A2322}.pol.massacre b{color:var(--bad)}
.reveal{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tc) 30%,#2A2E36) 0,rgba(0,0,0,.8) 65%)}
.rv-card{width:200px;height:280px;border-radius:8px;padding:12px 16px 16px;animation:flip .7s cubic-bezier(.2,.8,.3,1.2)}
.rv-card .cat{font-size:13px;margin-top:6px}
.rv-card .gl{font-family:var(--brush);font-size:104px;line-height:1;color:var(--cc);margin-top:8px}
.rv-card b{font-family:var(--display);font-size:26px;margin-top:2px}
.rv-card .tier{color:var(--tc);font-weight:700;letter-spacing:.4em;margin-top:2px;font-family:var(--brush);font-size:18px}
.rv-card p{font-size:12.5px;color:var(--ink-soft);margin:auto 0 0}
.reveal.t4 .rv-card{animation:flip .9s cubic-bezier(.2,.8,.3,1.2),goldglow 1.6s ease-in-out infinite}
.rv-tip{color:#F4ECD6;font-size:13px;font-family:var(--display)}
@keyframes flip{from{transform:perspective(600px) rotateY(180deg) scale(.6);opacity:0}}

/* ---------- 自动发牌 ---------- */
.shopbtn.deal{border-style:solid;gap:0}
.shopbtn .ring{position:absolute;top:6px;left:50%;width:40px;height:40px;margin-left:-20px;transform:rotate(-90deg)}
.shopbtn .ring circle{fill:none;stroke:rgba(178,58,42,.18);stroke-width:3}
.shopbtn .ring .fg{stroke:var(--seal);stroke-dasharray:106.8;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.shopbtn.deal b{font-family:var(--body);font-size:15px;height:40px;line-height:40px;margin-top:6px;font-weight:700}
.shopbtn.deal small{font-size:10.5px;line-height:1.3}
.flycard{--tc:var(--t1);position:fixed;z-index:70;left:50%;top:38%;width:76px;height:104px;margin:-52px 0 0 -38px;border-radius:6px;border:1.5px solid var(--tc);background:linear-gradient(#33373F,#1E2127);box-shadow:inset 0 0 0 3px #2A2E36,inset 0 0 0 4px var(--tc),0 10px 26px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:fly 1.8s cubic-bezier(.5,0,.4,1) forwards}
.flycard .gl{font-family:var(--brush);font-size:44px;color:var(--cc);margin-top:8px;line-height:1}
.flycard b{font-family:var(--display);font-size:14px}
.flycard small{color:var(--tc);font-weight:700;font-size:10px;letter-spacing:.2em;margin-top:auto;margin-bottom:6px}
.flycard.t4{box-shadow:inset 0 0 0 3px #2A2E36,inset 0 0 0 4px var(--t4),0 0 30px rgba(224,177,63,.8)}
@keyframes fly{0%{transform:translateY(-60px) rotateY(180deg) scale(.5);opacity:0}25%{transform:none;opacity:1}62%{transform:none;opacity:1}100%{transform:translate(-30vw,46vh) scale(.45) rotate(-8deg);opacity:0}}
.cardmini.fresh{animation:fresh 1.5s ease-out}
@keyframes fresh{0%{transform:translateY(-14px);box-shadow:0 0 0 3px var(--tc),0 0 18px var(--tc)}100%{transform:none}}
/* ---------- 天时 ---------- */
.omen{position:fixed;left:50%;top:calc(var(--st) + 120px);z-index:60;width:min(330px,86vw);transform:translateX(-50%);pointer-events:none;display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;background:linear-gradient(90deg,#1B1E24,#2A2E36 14%,#2A2E36 86%,#1B1E24);border-top:3px solid var(--brass);border-bottom:3px solid var(--brass);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:unroll 4.6s ease forwards}
.omen .og{flex:none;width:54px;height:54px;border-radius:4px;background:var(--seal);color:#FFF4E2;font-family:var(--brush);font-weight:900;font-size:34px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,240,220,.4)}
.omen.good .og{background:#2F7A48}
.omen small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--ink-soft)}
.omen b{display:block;font-family:var(--brush);font-size:24px;font-weight:400;line-height:1.15}
.omen p{margin:2px 0 0;font-size:13px;line-height:1.35}
@keyframes unroll{0%{clip-path:inset(0 50% 0 50%);opacity:0}12%{clip-path:inset(0 0 0 0);opacity:1}85%{opacity:1;transform:translateX(-50%)}100%{opacity:0;transform:translate(-50%,-14px)}}
.omens{position:absolute;top:calc(var(--st) + 58px);left:var(--gl);z-index:4;display:flex;gap:5px;pointer-events:none}
.omens span{background:rgba(30,33,40,.94);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;font-size:12px;font-family:var(--display);box-shadow:0 2px 5px rgba(0,0,0,.3)}
.omens span i{font-style:normal;font-family:var(--brush);font-size:15px;color:var(--seal);margin-right:3px}
.omens span.good i{color:var(--good)}
.omens:not(:empty)~.toasts{top:calc(var(--st) + 86px)}

/* ---------- 特殊兵种 ---------- */
.unitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.unitpick{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 7px;border:1.5px solid var(--line-2);border-radius:5px;background:var(--card);color:var(--text);font-family:var(--display)}
.unitpick .ug{width:38px;height:38px;border-radius:4px;background:#3A3F4A;color:#F2D27A;font-family:var(--brush);font-size:26px;display:grid;place-items:center;margin-bottom:3px}
.unitpick b{font-size:14px}
.unitpick small{font-size:11px;color:var(--ink-soft)}
.unitpick.on{border-color:var(--brass);box-shadow:0 0 0 2px rgba(217,169,58,.3);background:#3A3222}
.unitpick.on .ug{background:var(--seal);color:#FFF4E2}
.pl .ugl{font-style:normal;font-family:var(--brush);background:#3A3F4A;color:#F2D27A;border-radius:3px;padding:0 5px;font-size:15px;margin-left:4px}
.ellist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.elchip{display:inline-flex;align-items:center;gap:4px;background:#3A3F4A;color:#F2D27A;border-radius:3px;padding:2px 8px 2px 3px;font-size:13px}
.elchip i{font-style:normal;font-family:var(--brush);background:#F3DFA8;color:#2A211A;border-radius:2px;width:20px;text-align:center}
.btn.elite{background:#3A3F4A;color:#F2D27A;box-shadow:inset 0 0 0 2px rgba(242,210,122,.25),0 2px 0 #15171B}
.unitseg{flex-wrap:wrap}
.unitseg button i{font-style:normal;font-family:var(--brush);margin-right:3px;color:var(--seal)}
.elitetip{border-left:3px solid var(--brass);padding-left:8px}
.picking .bottom,.picking .hud .btns,.picking .toasts,.picking .toast,.picking .omens,.picking .hege{pointer-events:none!important;opacity:.3;transition:opacity .2s}
.hud .res{pointer-events:none}

/* ---------- 卡牌图案 ---------- */
.ci{display:block;width:40px;height:40px;color:#ECE4D2;margin-top:2px;stroke-width:2.2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.cardmini .ci{width:46px;height:46px;margin:-3px 0 -4px}
.gl.seal{position:absolute;right:5px;top:5px;width:16px;height:16px;line-height:16px;font-size:12px;color:#FFF4E2;background:var(--seal);border-radius:2px;text-align:center;margin:0;text-shadow:none;box-shadow:inset 0 0 0 1px rgba(255,240,220,.35)}
.cardmini .cat{align-self:flex-start;margin-left:2px}
.bigcard .face .ci{width:64px;height:64px;margin-top:8px}
.bigcard .face .gl.seal{width:22px;height:22px;line-height:22px;font-size:16px;right:8px;top:8px}
.rv-card .ci{width:120px;height:120px;margin-top:10px}
.rv-card .gl.seal{width:30px;height:30px;line-height:30px;font-size:22px;right:12px;top:12px}
.flycard .ci{width:46px;height:46px;margin-top:10px}
.flycard .gl.seal{width:16px;height:16px;line-height:16px;font-size:12px}
.shop .item .top .ci{width:30px;height:30px;margin-left:auto;margin-top:0}

/* ---------- 横屏 ---------- */
@media (orientation: landscape) and (max-height: 520px){
  .hud{padding-top:calc(var(--st) + 4px)}
  .res{max-width:560px;flex:0 1 560px}
  .hud .btns{top:calc(var(--st) + 4px);flex-direction:row;right:var(--gr);gap:6px}
  .ibtn{height:38px}
  .bottom{left:auto;right:var(--gr);width:min(60vw,520px);padding-top:10px;padding-bottom:calc(var(--sb) + 6px);background:none}
  .handbar{justify-content:flex-end;margin:0}
  .cardmini,.shopbtn{height:84px}
  .toasts{top:calc(var(--st) + 50px);right:auto;left:var(--gl);width:min(46vw,420px)}
  .omens{top:calc(var(--st) + 50px)}
  .omens:not(:empty)~.toasts{top:calc(var(--st) + 78px)}
  .banner{top:auto;bottom:calc(var(--sb) + 10px);left:var(--gl);transform:none}
  .hege{top:calc(var(--st) + 50px);right:auto;left:var(--gl);width:min(50vw,460px)}
  .sheet{max-width:560px;max-height:92%}
  .omen{top:calc(var(--st) + 60px)}
}

/* ---------- 顶栏卷轴底 ---------- */
.hud::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 56px);background:var(--grain),linear-gradient(#2A2E36,#1E2128);border-bottom:2px solid var(--brass);box-shadow:0 3px 10px rgba(0,0,0,.45);pointer-events:none;z-index:-1}
.hud{z-index:7}
.chip{box-shadow:none;border-color:rgba(200,180,140,.3);background:rgba(20,22,28,.75)}
.chip.phase{box-shadow:inset 0 0 0 1px rgba(255,240,220,.25)}
.ibtn{background:var(--grain),linear-gradient(#2E323A,#1F2228);border-color:#6A6150;box-shadow:0 2px 0 #6A6150,0 3px 6px rgba(0,0,0,.4)}
.ibtn:active{transform:translateY(2px);box-shadow:0 0 0 #6A6150}
.bottom{background:linear-gradient(rgba(16,18,22,0),rgba(16,18,22,.95) 40%)}
.bottom::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brass)}
/* 兵种属性条 */
.ustats{display:flex;gap:4px;margin-top:3px}
.ustat{font-size:10px;color:var(--ink-soft);font-family:var(--num)}
.ustat i{font-style:normal;color:var(--brass);margin-right:1px}
.h,.logo,.code,.mv-n,.end-title,.pol b,.altar b,.dip-top b,.omen b,.shopbtn b,.unitpick .ug,.pl .ugl,.elchip i,.unitseg button i,.omens span i,.tierpill,.pill,.draw-box .odds b,.help h4{font-weight:900}
@media (prefers-reduced-motion: reduce){.sheet,.toast,.rv-card,.cardmini,.chip{animation:none!important}}
</style>
</head>
<body>

<section class="screen" id="sBoot"><div class="loading">正在载入…</div></section>

<section class="screen page" id="sAuth" hidden>
  <div class="wrap">
<div class="hero"><svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs><linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A8290" stop-opacity=".7"/><stop offset="1" stop-color="#7A8290" stop-opacity="0"/></linearGradient>
      <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C424C" stop-opacity=".95"/><stop offset="1" stop-color="#3C424C" stop-opacity=".1"/></linearGradient></defs>
      <circle cx="96" cy="70" r="30" fill="#B8352A" opacity=".9"/>
      <path d="M0 150 C40 120 60 92 92 104 C120 114 128 80 160 70 C190 62 205 98 236 92 C270 85 290 60 320 66 C352 72 372 100 400 96 L400 210 L0 210Z" fill="url(#m1)"/>
      <path d="M0 176 C30 160 52 130 78 136 C100 141 108 118 132 112 C158 106 170 140 196 142 C222 144 236 120 262 126 C292 133 300 162 330 160 C360 158 380 140 400 146 L400 210 L0 210Z" fill="url(#m2)"/>
      <path d="M0 196 C60 186 120 200 200 192 C280 184 340 198 400 190 L400 210 L0 210Z" fill="#1F2228" opacity=".95"/>
      <g stroke="#C9BFA8" stroke-width="1.6" fill="none" opacity=".5"><path d="M40 60 q6 -5 12 0 q6 -5 12 0"/><path d="M150 40 q5 -4 10 0 q5 -4 10 0"/></g>
    </svg><h1 class="logo">苍澜</h1><span class="seal-mark">乱战</span></div>
    <p class="lead">好友同场，实时争霸。先发育，再纵横。攒资源换卡牌，侦查迷雾，伏击敌军，救援盟友。</p>
    <div id="authOnline">
      <div class="seg" id="authSeg"><button aria-pressed="true" data-m="in">登录</button><button aria-pressed="false" data-m="up">注册</button></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <input id="aName" placeholder="游戏昵称（最多 8 字）" maxlength="8" hidden autocomplete="nickname">
        <input id="aEmail" type="email" placeholder="邮箱" autocomplete="email">
        <input id="aPw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
        <p class="err" id="aErr"></p>
        <button class="btn block" id="aGo">登录</button>
      </div>
    </div>
    <div id="authOffline" class="card" hidden><b>联机服务还没配置</b><p class="tip" style="margin:6px 0 0">需要先把 Firebase 配置填进 config.js。现在可以先和电脑对战试玩。</p></div>
    <button class="btn ghost block" id="aSolo">单机练习（和电脑打）</button>
  </div>
</section>

<section class="screen page" id="sHome" hidden>
  <div class="wrap">
<div class="hero small"><svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs><linearGradient id="m1small" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A8290" stop-opacity=".7"/><stop offset="1" stop-color="#7A8290" stop-opacity="0"/></linearGradient>
      <linearGradient id="m2small" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C424C" stop-opacity=".95"/><stop offset="1" stop-color="#3C424C" stop-opacity=".1"/></linearGradient></defs>
      <circle cx="96" cy="70" r="30" fill="#B8352A" opacity=".9"/>
      <path d="M0 150 C40 120 60 92 92 104 C120 114 128 80 160 70 C190 62 205 98 236 92 C270 85 290 60 320 66 C352 72 372 100 400 96 L400 210 L0 210Z" fill="url(#m1small)"/>
      <path d="M0 176 C30 160 52 130 78 136 C100 141 108 118 132 112 C158 106 170 140 196 142 C222 144 236 120 262 126 C292 133 300 162 330 160 C360 158 380 140 400 146 L400 210 L0 210Z" fill="url(#m2small)"/>
      <path d="M0 196 C60 186 120 200 200 192 C280 184 340 198 400 190 L400 210 L0 210Z" fill="#1F2228" opacity=".95"/>
      <g stroke="#C9BFA8" stroke-width="1.6" fill="none" opacity=".5"><path d="M40 60 q6 -5 12 0 q6 -5 12 0"/><path d="M150 40 q5 -4 10 0 q5 -4 10 0"/></g>
    </svg><h1 class="logo">苍澜</h1><span class="seal-mark">乱战</span></div>
    <div class="row" style="align-items:flex-end"><div><div class="tip">主公</div><div style="font-family:var(--brush);font-size:32px;line-height:1.1" id="hName"></div></div><button class="btn sm ghost" style="flex:none" id="hRename">改名</button></div>
    <div class="stats"><div class="stat"><b id="hLv">1</b><small>等级</small></div><div class="stat"><b id="hGames">0</b><small>场次</small></div><div class="stat"><b id="hWins">0</b><small>胜场</small></div></div>
    <button class="btn block" id="hResume" hidden>回到进行中的对局</button>
    <div class="h">开一局</div>
    <button class="btn block" id="hCreate">创建房间</button>
    <div class="row"><input id="hCode" placeholder="输入 4 位房间号" maxlength="4" style="text-transform:uppercase"><button class="btn ghost" style="flex:none" id="hJoin">加入</button></div>
    <p class="err" id="hErr"></p>
    <button class="btn ghost block" id="hSolo">单机练习（和电脑打）</button>
    <button class="btn ghost block" id="hHelp">玩法说明</button>
    <button class="btn bad block" id="hOut">退出登录</button>
  </div>
</section>

<section class="screen page" id="sRoom" hidden>
  <div class="wrap" style="padding-top:calc(var(--st) + 28px)">
    <div class="tip" style="text-align:center">房间号 · 发给好友，让他们在首页输入</div>
    <div class="code" id="rCode"></div>
    <button class="btn ghost sm" id="rCopy" style="align-self:center">复制房间号</button>
    <div class="h">玩家 <span class="tip" id="rCount"></span></div>
    <div class="plist" id="rPlayers"></div>
    <div class="h">特殊兵种</div>
    <div class="unitgrid" id="rUnits"></div>
    <div class="card tip" id="rUnitDesc"></div>
    <div id="rHost">
      <button class="btn ghost block" id="rBot">＋ 加一个电脑玩家</button>
      <div class="card tip" style="margin:12px 0">每局 <b>25 分钟</b>：前 5 分钟发育期，最后 3 分钟全图公开决战。发育期后占据六成以上领地（两人局七成）并守住 60 秒，可提前称霸。</div>
      <p class="err" id="rErr"></p>
      <button class="btn block" id="rStart">开始游戏</button>
    </div>
    <div id="rWait" class="card tip" hidden>等待房主开始…</div>
    <button class="btn bad block" id="rLeave">离开房间</button>
  </div>
</section>

<section class="screen" id="sGame" hidden>
  <canvas id="map"></canvas>
  <div class="hud">
    <div class="res">
      <div class="chip phase" id="cPhase"><small id="cPhaseL">发育期</small><b class="num" id="cTime">--:--</b></div>
      <div class="chip"><small>金 <span id="cGoldR"></span></small><b class="num" id="cGold">0</b></div>
      <div class="chip"><small>粮 <span id="cFoodR"></span></small><b class="num" id="cFood">0</b></div>
      <div class="chip"><small>兵</small><b class="num" id="cTroops">0</b></div>
      <div class="chip"><small>民</small><b class="num" id="cPop">0</b></div>
      <div class="chip"><small>名望</small><b class="num" id="cRen">0</b></div>
    </div>
    <div class="btns">
      <button class="ibtn" id="bDip">外交<span class="dot" id="dDip" hidden></span></button>
      <button class="ibtn" id="bLog">战报<span class="dot" id="dLog" hidden></span></button>
      <button class="ibtn" id="bMenu" aria-label="菜单">☰</button>
    </div>
  </div>
  <div class="omens" id="omens"></div>
  <div class="hege" id="hege" hidden></div>
  <div class="toasts" id="toasts"></div>
  <div class="banner" id="banner" hidden><span id="bannerT"></span><button id="bannerX">取消</button></div>
  <div class="bottom"><div class="handbar" id="hand"></div></div>
  <div class="countdown" id="countdown" hidden><div><span id="cdN">3</span><small>即将开局</small></div></div>
</section>

<script src="config.js"></script>
<script src="sim.js"></script>
<script src="bots.js"></script>
<script src="render.js"></script>
<script src="net.js"></script>
<script src="audio.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
