<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>情书·宫廷传书</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="情书">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A1A22">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 宫廷夜色：绛紫底、金线、八种牌各有一色 */
:root{--bg:#1C1218;--panel:#2A1A22;--panel-2:#3A2630;--card:#33202A;--text:#F2E6D8;--soft:#D4C2B0;--muted:#9E8A8E;--line:#5A3E48;--gold:#D9A93A;--red:#C9323F;--good:#6BBF6E;--bad:#FF6A6A;
  --c1:#8FA3B5;--c2:#7FB0A0;--c3:#C9A24A;--c4:#D98FB0;--c5:#5FB8E8;--c6:#E0B13F;--c7:#B48CFF;--c8:#FF6B8A;
  --display:"Noto Serif SC","Songti SC","STSong",serif;--body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--gl:max(14px,env(safe-area-inset-left,0px));--gr:max(14px,env(safe-area-inset-right,0px));
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .95  0 0 0 0 .8  0 0 0 0 .7  0 0 0 .06 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;width:100%;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.page{overflow-y:auto;padding:calc(var(--st) + 24px) max(20px,env(safe-area-inset-left,0px)) calc(var(--sb) + 28px) max(20px,env(safe-area-inset-right,0px));background:var(--grain),radial-gradient(120% 70% at 50% 0%,#4A2A3A 0%,var(--bg) 60%)}
.wrap{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.logo{font-family:var(--display);font-weight:900;font-size:44px;margin:10px 0 0;line-height:1.1;letter-spacing:.08em}
.logo small{display:block;font-size:13px;letter-spacing:.5em;color:var(--gold);margin-top:8px;font-weight:600}
.lead{color:var(--soft);font-size:14px;margin:0}
.h{font-family:var(--display);font-weight:900;font-size:20px;margin:10px 0 -4px;display:flex;align-items:center;gap:10px}
.h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.btn{border:0;border-radius:4px;padding:12px 16px;font-weight:700;background:var(--red);color:#FFF1E0;font-size:15px;font-family:var(--display);letter-spacing:.08em;box-shadow:inset 0 0 0 2px rgba(255,235,210,.22),0 2px 0 #7A1E28}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}.btn.sm{padding:7px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
.tip{font-size:13px;color:var(--muted)}.tip b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px;font-family:var(--display)}
.stat small{color:var(--muted);font-size:12px;letter-spacing:.2em}
.seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:3px;padding:8px 4px;font-size:14px;font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:700}
.code{font-family:var(--display);font-weight:900;font-size:56px;letter-spacing:.25em;text-align:center;color:var(--gold);line-height:1.2}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}
.pl span{flex:1;font-family:var(--display);font-weight:600}.pl small{color:var(--muted)}
.pl button{border:0;background:none;color:var(--muted);font-size:14px}
.hub-link{display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:none;padding:6px;font-family:var(--display)}

/* ---------- 牌 ---------- */
.card{--cc:var(--c1);position:relative;width:96px;height:140px;border-radius:9px;background:var(--grain),linear-gradient(160deg,#3D2733,#241620);border:1.5px solid var(--cc);box-shadow:inset 0 0 0 3px #2A1A22,inset 0 0 0 4px color-mix(in srgb,var(--cc) 60%,transparent),0 6px 16px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;color:var(--text);flex:none;transition:transform .15s}
.card .num{position:absolute;left:8px;top:6px;font-family:var(--display);font-weight:900;font-size:20px;color:var(--cc);line-height:1}
.card .art{width:56px;height:56px;margin-top:22px;color:var(--cc)}
.card .art svg{width:100%;height:100%}
.card b{font-family:var(--display);font-weight:900;font-size:17px;margin-top:4px;letter-spacing:.1em}
.card small{font-size:10px;color:var(--muted);margin-top:auto;margin-bottom:8px}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}.c5{--cc:var(--c5)}.c6{--cc:var(--c6)}.c7{--cc:var(--c7)}.c8{--cc:var(--c8)}
.card.mini{width:54px;height:78px;border-radius:6px;box-shadow:inset 0 0 0 2px #2A1A22,inset 0 0 0 3px color-mix(in srgb,var(--cc) 60%,transparent),0 3px 8px rgba(0,0,0,.4)}
.card.mini .num{left:5px;top:3px;font-size:13px}.card.mini .art{width:28px;height:28px;margin-top:14px}.card.mini b{font-size:11px;margin-top:2px;letter-spacing:0}.card.mini small{display:none}
.card.back{--cc:var(--gold);background:var(--grain),repeating-linear-gradient(45deg,#3A2430 0 6px,#2E1C26 6px 12px);justify-content:center}
.card.back .seal{width:30px;height:48px;border-radius:3px;background:var(--red);color:#FFF1E0;font-family:var(--display);font-weight:900;font-size:16px;line-height:1.3;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,240,220,.35)}
.card.mini.back .seal{width:22px;height:34px;font-size:11px}
.card.empty,.card.gone{--cc:var(--line);border-style:dashed;background:transparent;box-shadow:none;justify-content:center;color:var(--muted);font-size:12px}
.card.gone{color:var(--bad);border-color:var(--bad)}
.card.known{box-shadow:inset 0 0 0 2px #2A1A22,inset 0 0 0 3px var(--cc),0 0 14px color-mix(in srgb,var(--cc) 60%,transparent)}
.card.known::after{content:"已知";position:absolute;right:-4px;top:-6px;background:var(--gold);color:#2A1A22;font-size:9px;padding:0 4px;border-radius:2px;font-weight:700}
.card.playable{cursor:pointer}
.card.playable:hover,.card.picked{transform:translateY(-10px);box-shadow:inset 0 0 0 3px #2A1A22,inset 0 0 0 4px var(--cc),0 0 24px color-mix(in srgb,var(--cc) 70%,transparent)}
.card.locked{opacity:.45;filter:grayscale(.6)}

/* ---------- 牌局 ---------- */
#sGame{background:var(--grain),radial-gradient(120% 60% at 50% 100%,#4A2A3A 0%,var(--bg) 70%)}
.hud{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 8px) var(--gr) 8px var(--gl);border-bottom:1px solid var(--line);background:rgba(26,16,22,.8)}
.hud b{font-family:var(--display);font-weight:900;font-size:17px;flex:1}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:3px;height:38px;min-width:44px;padding:0 10px;font-family:var(--display);font-weight:700;font-size:14px}
.table{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px var(--gr) 10px var(--gl)}
.opps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.opps::-webkit-scrollbar{display:none}
.opp{position:relative;flex:1 0 150px;max-width:220px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px;display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.opp .who{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px}
.opp .who i{width:12px;height:12px;border-radius:50%;flex:none}
.opp .who b{font-family:var(--display);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearts{color:var(--red);font-size:12px;letter-spacing:1px}.hearts .dim{color:var(--line)}
.opp .disc{display:flex;gap:6px;align-items:center}
.opp .disc small{font-size:10px;color:var(--muted);line-height:1.3}
.opp.cur{border-color:var(--gold);box-shadow:0 0 18px rgba(217,169,58,.35)}
.opp.out{opacity:.55}.opp.safe{border-color:var(--c4)}
.badge{position:absolute;right:6px;top:6px;font-size:10px;background:var(--c4);color:#2A1A22;padding:1px 6px;border-radius:3px;font-weight:700}
.badge.turn{background:var(--gold);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.5}}
.center{display:flex;align-items:center;gap:14px;justify-content:center;padding:6px 0}
.deck{position:relative}
.deck .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 1px 4px #000}
.center .lbl{font-size:12px;color:var(--muted);text-align:center}.center .lbl b{color:var(--gold)}
.recent{list-style:none;margin:0;padding:0 4px;display:flex;flex-direction:column;gap:3px}
.recent li{font-size:13px;color:var(--soft);font-family:var(--display);padding:4px 8px;border-left:3px solid var(--line);background:rgba(0,0,0,.2);border-radius:0 4px 4px 0}
.recent li.out{border-left-color:var(--bad)}.recent li.phase{border-left-color:var(--gold)}.recent li.secret{border-left-color:var(--c3);color:var(--c3)}
.faceup{display:flex;gap:4px}
.me{border-top:1px solid var(--line);background:rgba(26,16,22,.85);padding:8px var(--gr) calc(var(--sb) + 10px) var(--gl)}
.me .who{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.me .who i{width:12px;height:12px;border-radius:50%}
.me .who b{font-family:var(--display)}
.me .who .disc{margin-left:auto;font-size:11px;color:var(--muted)}
.me .who .disc span{font-weight:700}
#status{font-family:var(--display);font-size:15px;text-align:center;padding:4px 0 8px;color:var(--soft)}
.hand{display:flex;gap:14px;justify-content:center;min-height:150px;align-items:flex-end;padding-top:12px}
.hand.myturn #status{color:var(--gold)}
.note{color:var(--muted);font-size:13px;margin:6px 0}
.note.warn{color:var(--bad);font-weight:700}
.toasts{position:absolute;bottom:calc(var(--sb) + 236px);left:var(--gl);right:var(--gr);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{background:rgba(42,26,34,.96);border:1px solid var(--line);border-left:5px solid var(--soft);border-radius:3px;padding:8px 12px;font-size:14px;max-width:480px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .25s ease-out;font-family:var(--display)}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--good)}.toast.secret{border-left-color:var(--gold);background:#3A2A1A}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* ---------- 弹出层 ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--grain),linear-gradient(#33202A,#1F1319);border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;max-height:86%;border-radius:8px 8px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;position:relative}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#8A6A2E,var(--gold) 20%,#8A6A2E 50%,var(--gold) 80%,#8A6A2E);border-radius:8px 8px 0 0}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.sh-head h3{margin:0;font-family:var(--display);font-weight:900;font-size:22px;flex:1}
.sh-head .x{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:4px 12px;font-size:14px}
.sh-body{overflow-y:auto;padding:6px 16px calc(18px + var(--sb));display:flex;flex-direction:column;gap:12px}
.play{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.play .desc{margin:0 0 8px;font-size:14px}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 4px;letter-spacing:.1em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:6px 10px;font-size:14px;font-family:var(--display)}
.opt i{width:10px;height:10px;border-radius:50%}
.opt em{font-style:normal;font-size:11px;color:var(--gold)}
.opt.on{border-color:var(--gold);background:#3A2A1A}
.opts.guess .opt{--cc:var(--c1);border-color:color-mix(in srgb,var(--cc) 50%,var(--line))}
.opts.guess .opt .num{font-weight:900;color:var(--cc)}
.opts.guess .opt.on{background:color-mix(in srgb,var(--cc) 25%,var(--card));border-color:var(--cc)}
.rwin{font-family:var(--display);font-weight:900;font-size:26px;text-align:center;color:var(--gold)}
.rwin.me{color:var(--c8)}
.reveal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.rv i{width:10px;height:10px;border-radius:50%}
.rv b{font-family:var(--display)}
.rv.out{opacity:.6}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.log li{font-size:14px;padding:6px 4px;border-bottom:1px dashed var(--line);font-family:var(--display)}
.log li.out{color:var(--bad)}.log li.phase{color:var(--gold);font-weight:700}.log li.secret{color:var(--c3)}
.help h4{margin:12px 0 4px;color:var(--gold);font-family:var(--display);font-weight:900;font-size:18px}
.help p{margin:0 0 6px;font-size:14px}
.hrow{display:grid;grid-template-columns:28px auto auto 1fr;gap:4px 8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line)}
.hrow .hn{--cc:var(--c1);font-family:var(--display);font-weight:900;color:var(--cc);font-size:18px}
.hrow b{font-family:var(--display)}.hrow>span:nth-child(3){color:var(--muted);font-size:12px}
.hrow p{grid-column:1/-1;margin:0;font-size:13px;color:var(--soft)}
/* 角色一览 */
.gallery{display:flex;flex-direction:column;gap:10px}
.gitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.gitem b{--cc:var(--c1);font-family:var(--display);font-weight:900;font-size:18px;color:var(--cc)}
.gitem p{margin:4px 0;font-size:14px}.gitem small{color:var(--muted);font-size:12px}
/* 新手教程 */
.tut-spot{position:fixed;z-index:34;pointer-events:none;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.5),0 0 0 3px var(--gold),0 0 22px 4px rgba(217,169,58,.55);transition:left .25s,top .25s,width .25s,height .25s}
.tut{pointer-events:none;position:fixed;z-index:36;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 250px);width:min(360px,calc(100% - 24px));background:var(--grain),linear-gradient(#3D2733,#241620);border:1.5px solid var(--gold);border-radius:8px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:var(--display)}
.tut.top{bottom:auto;top:calc(var(--st) + 60px)}
.tut-n{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.tut-t{font-size:14.5px;line-height:1.55;margin:4px 0 10px}.tut-t b{color:#FFD65A}
.tut-b{display:flex;align-items:center;gap:8px}.tut-b button{pointer-events:auto}
.tut-b .tut-wait{flex:1;text-align:right;font-size:13px;color:var(--soft)}
.tut-b #tutNext{margin-left:auto}
@media (orientation: landscape) and (max-height: 520px){.hand{min-height:120px}.card{width:80px;height:116px}.card .art{width:44px;height:44px;margin-top:18px}}
</style>
</head>
<body>
<section class="screen" id="sBoot"><div style="display:grid;place-items:center;height:100%;color:var(--muted);font-family:var(--display)">正在载入…</div></section>

<section class="screen page" id="sAuth" hidden>
  <div class="wrap">
    <h1 class="logo">情书<small>宫 廷 传 书</small></h1>
    <p class="lead">16 张牌，8 种角色，每人手里只有 1 张。猜牌、比牌、偷看、调换，把情书送到公主手里。2–4 人联机，几分钟一局。</p>
    <div id="authOnline">
      <div class="seg" id="authSeg"><button aria-pressed="true" data-m="in">登录</button><button aria-pressed="false" data-m="up">注册</button></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
        <input id="aName" placeholder="游戏昵称（最多 8 字）" maxlength="8" hidden autocomplete="nickname">
        <input id="aEmail" type="email" placeholder="邮箱" autocomplete="email">
        <input id="aPw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
        <p class="err" id="aErr"></p>
        <button class="btn block" id="aGo">登录</button>
        <p class="tip" style="text-align:center">和苍澜·乱战是同一个账号</p>
      </div>
    </div>
    <div id="authOffline" class="cardbox" hidden><b>联机服务还没配置</b><p class="tip">现在可以先和电脑对战。</p></div>
    <button class="btn ghost block" id="aSolo">单机练习（和电脑打）</button>
    <div class="row"><button class="btn ghost block" id="aTut">🎓 新手教程</button><button class="btn ghost block" id="aCards">八种角色</button></div>
    <button class="btn ghost block" id="aHelp">玩法说明</button>
    <a class="hub-link" href="../">← 回到游戏大厅</a>
  </div>
</section>

<section class="screen page" id="sHome" hidden>
  <div class="wrap">
    <h1 class="logo">情书<small>宫 廷 传 书</small></h1>
    <div class="row" style="align-items:flex-end"><div><div class="tip">追求者</div><div style="font-family:var(--display);font-size:30px;font-weight:900;line-height:1.1" id="hName"></div></div></div>
    <div class="stats"><div class="stat"><b id="hGames">0</b><small>场次</small></div><div class="stat"><b id="hWins">0</b><small>胜场</small></div></div>
    <button class="btn block" id="hResume" hidden>回到进行中的对局</button>
    <div class="h">开一局</div>
    <button class="btn block" id="hCreate">创建房间</button>
    <div class="row"><input id="hCode" placeholder="输入 4 位房间号" maxlength="4" style="text-transform:uppercase"><button class="btn ghost" style="flex:none" id="hJoin">加入</button></div>
    <p class="err" id="hErr"></p>
    <button class="btn ghost block" id="hSolo">单机练习（和电脑打）</button>
    <div class="row"><button class="btn ghost block" id="hTut">🎓 新手教程</button><button class="btn ghost block" id="hCards">八种角色</button></div>
    <button class="btn ghost block" id="hHelp">玩法说明</button>
    <button class="btn bad block" id="hOut">退出登录</button>
    <a class="hub-link" href="../">← 回到游戏大厅</a>
  </div>
</section>

<section class="screen page" id="sRoom" hidden>
  <div class="wrap">
    <div class="tip" style="text-align:center">房间号 · 发给好友，让他们在首页输入</div>
    <div class="code" id="rCode"></div>
    <button class="btn ghost sm" id="rCopy" style="align-self:center">复制房间号</button>
    <div class="h">玩家 <span class="tip" id="rCount"></span></div>
    <div class="plist" id="rPlayers"></div>
    <div class="cardbox tip">先集满 <b id="rNeed">4</b> 颗 ❤ 的人获胜（两人 7 颗、三人 5 颗、四人 4 颗）。每轮几分钟。</div>
    <div id="rHost">
      <button class="btn ghost block" id="rBot">＋ 加一个电脑玩家</button>
      <p class="err" id="rErr"></p>
      <button class="btn block" id="rStart" style="margin-top:10px">开始游戏</button>
    </div>
    <div id="rWait" class="cardbox tip" hidden>等待房主开始…</div>
    <button class="btn bad block" id="rLeave">离开房间</button>
  </div>
</section>

<section class="screen" id="sGame" hidden>
  <div class="hud"><b id="round">第 1 轮</b><button class="ibtn" id="bCards">角色</button><button class="ibtn" id="bLog">战报</button><button class="ibtn" id="bMenu">☰</button></div>
  <div class="toasts" id="toasts"></div>
  <div class="table">
    <div class="opps" id="opps"></div>
    <div class="center">
      <div><div class="deck"><div class="card mini back"><div class="seal">情<br>书</div></div></div><div class="lbl">牌库 <b id="deckN">0</b> 张</div></div>
      <div id="faceUpBox" hidden><div class="faceup" id="faceUp"></div><div class="lbl">明牌（不在局中）</div></div>
    </div>
    <ul class="recent" id="recent"></ul>
  </div>
  <div class="me">
    <div class="who"><i id="me-flag"></i><b id="me-name"></b><span class="hearts" id="me-hearts"></span><span class="disc" id="me-disc"></span></div>
    <div id="status"></div>
    <div class="hand" id="hand"></div>
  </div>
</section>

<script src="config.js"></script>
<script src="sim.js"></script>
<script src="art.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
